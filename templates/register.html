<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Flask Auth</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h2>Create Account</h2>
    <form method="POST">
        <label for="username">Username</label>
        <input id="username" type="text" name="username" placeholder="Choose Username" autocomplete="username" required>

        <label for="password">Password</label>
        <input id="password" type="password" name="password" placeholder="Choose Password" autocomplete="new-password" required>

        <button type="submit">Register</button>
    </form>
    <a href="{{ url_for('login') }}">Already have an account? Login</a>
</div>
</body>
</html>
